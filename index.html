
<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amplia Solutions | Engenharia de Software e IA</title>
    
    <!-- Security Headers - Optimized for Performance -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <meta name="description" content="A Amplia Solutions transforma desafios complexos em soluções digitais inteligentes. Especialistas em IA, Cloud e Consultoria IT." />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
      (function() {
        try {
          const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {}
      })();
    </script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              amplia: {
                green: '#8cc63f',
                dark: '#0f1115',
                light: '#f9fafb'
              }
            },
            fontFamily: { 'max': ['Outfit', 'sans-serif'] },
            animation: { 'fade-in-up': 'fadeInUp 0.5s ease-out forwards', 'bounce-slow': 'bounce 3s infinite' },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' }
              }
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Outfit', sans-serif; -webkit-font-smoothing: antialiased; }
      .glass { backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
      .hp-field { display: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.0.0",
        "react/": "https://esm.sh/react@19.0.0/",
        "react-dom": "https://esm.sh/react-dom@19.0.0",
        "react-dom/": "https://esm.sh/react-dom@19.0.0/",
        "@google/genai": "https://esm.sh/@google/genai",
        "lucide-react": "https://esm.sh/lucide-react@0.460.0"
      }
    }
    </script>
  </head>
  <body class="bg-white dark:bg-amplia-dark text-gray-900 dark:text-gray-100 selection:bg-amplia-green/30">
    <div id="root"></div>
  </body>
</html>
