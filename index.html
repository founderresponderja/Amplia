
<!DOCTYPE html>
<html lang="pt-PT" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Amplia Solutions | Engenharia de Software e IA</title>
    <meta name="description" content="A Amplia Solutions transforma desafios complexos em soluções digitais inteligentes. Especialistas em IA, Cloud e Consultoria IT." />
    <meta name="keywords" content="it consulting, software engineering, artificial intelligence, devops, portugal" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://amplia.pt" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amplia.pt/" />
    <meta property="og:title" content="Amplia Solutions | Engenharia de Software e IA" />
    <meta property="og:description" content="Consultoria tecnológica de elite. Soluções inteligentes e escaláveis através de IA e Engenharia." />
    <meta property="og:image" content="https://amplia.pt/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://amplia.pt/" />
    <meta property="twitter:title" content="Amplia Solutions | Engenharia de Software e IA" />
    <meta property="twitter:description" content="Consultoria tecnológica de elite. Soluções inteligentes e escaláveis através de IA e Engenharia." />
    <meta property="twitter:image" content="https://amplia.pt/og-image.jpg" />
    
    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Amplia Solutions",
      "url": "https://amplia.pt",
      "logo": "https://amplia.pt/logo.png",
      "description": "Consultoria tecnológica de elite especializada em Inteligência Artificial e Engenharia de Software.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Agualva-Cacém",
        "addressRegion": "Lisboa",
        "postalCode": "2735-374",
        "addressCountry": "PT"
      },
      "sameAs": [
        "https://www.linkedin.com/in/amplia-solutions/",
        "https://www.instagram.com/ampliasolutions/"
      ]
    }
    </script>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
      (function() {
        try {
          const localTheme = localStorage.getItem('theme');
          const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && systemTheme)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              amplia: {
                green: '#8cc63f',
                dark: '#0f1115',
                light: '#f9fafb',
                gray: '#6b7280'
              }
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'bounce-slow': 'bounce 3s infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .dark .glass {
        background: rgba(15, 17, 21, 0.6);
      }
    </style>
  </head>
  <body class="bg-white dark:bg-amplia-dark text-gray-900 dark:text-gray-100">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
